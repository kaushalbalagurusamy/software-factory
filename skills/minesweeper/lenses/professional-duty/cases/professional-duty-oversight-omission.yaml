schema_version: 1
id: professional-duty-oversight-omission
kind: omission
twin: professional-duty-oversight-omission-clean
brief: |
  Rosewood Health: symptom-check assistant for a regional clinic network
  Users: triage nurses.
  1. A nurse enters a patient's reported symptoms.
  2. The assistant returns a suggested urgency level and a next step.
  3. The assistant drafts a message back to the patient for the nurse to send.
  4. Integrates with the scheduling system to offer appointment slots.
  5. Responses must arrive within two seconds, logged with the patient id.
  6. All transport is encrypted and access is role-based.
expect:
  omissions: [professional-duty.clinical-oversight]
