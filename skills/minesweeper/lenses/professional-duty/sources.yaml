    adapter: web_page
    tier: primary
    kind: standard
    notes: >-
      ieee.org returned HTTP 202 with an empty bot-challenge body on 2026-10-15 (three URL variants). Not quoted;
      traps rely on se-code instead.
  - id: nspe-code
    title: NSPE Code of Ethics for Engineers
    url: https://www.nspe.org/resources/ethics/code-ethics
    adapter: web_page
    tier: primary
    kind: standard
    notes: >-
      The page fetches but is a landing page without the code's text; the text is a PDF that the web_page adapter
      cannot parse (checked 2026-10-15). Not quoted.
  - id: usc-21-360j
    title: 21 U.S.C. 360j (FD&C Act section 520)
    url: https://www.law.cornell.edu/uscode/text/21/360j
    adapter: web_page
    tier: primary
    kind: statute
    notes: Cornell LII reproduction of the US Code.
    quotes:
      - text: shall not include a software function that is intended—
        locator: 360j(o)(1), lead-in
        fetched: "2026-10-15"
        supports: [professional-duty.clinical-advice-without-reviewable-basis]
      - text: enabling such health care professional to independently review the basis for such recommendations that such software presents so that it is not the intent that such health care professional rely primarily on any of such recommendations to make a clinical diagnosis or treatment decision regarding an individual patient.
        locator: 360j(o)(1)(E)(iii)
        fetched: "2026-10-15"
        supports: [professional-duty.clinical-advice-without-reviewable-basis]
      - text: supporting or providing recommendations to a health care professional about prevention, diagnosis, or treatment of a disease or condition; and
        locator: 360j(o)(1)(E)(ii)
        fetched: "2026-10-15"
        supports: [professional-duty.clinical-advice-without-reviewable-basis]
  - id: fda-cds-guidance
    title: FDA guidance - Clinical Decision Support Software (landing page)
    url: https://www.fda.gov/regulatory-information/search-fda-guidance-documents/clinical-decision-support-software
    adapter: web_page
    tier: primary
    kind: guidance
    notes: Landing page summary only; the full guidance is a PDF the adapter cannot parse.
    quotes:
      - text: This guidance further clarifies that FDA’s existing digital health policies continue to apply to software functions that meet the definition of a device, including those that are intended for use by patients or caregivers.
        locator: Summary
        fetched: "2026-10-15"
        supports: [professional-duty.clinical-advice-without-reviewable-basis]
