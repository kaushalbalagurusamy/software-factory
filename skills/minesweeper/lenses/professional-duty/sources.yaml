schema_version: 1
sources:
  - id: se-code
    title: Software Engineering Code of Ethics and Professional Practice (IEEE-CS/ACM Joint Task Force), version 5.2
    url: https://www.computer.org/education/code-of-ethics
    adapter: web_page
    tier: primary
    kind: standard
    notes: The joint ACM and IEEE Computer Society code, hosted by IEEE-CS. Clause numbers are from the full version.
    quotes:
      - text: Approve software only if they have a well-founded belief that it is safe, meets specifications, passes appropriate tests, and does not diminish quality of life, diminish privacy or harm the environment.
        locator: Clause 1.03
        fetched: "2026-10-15"
        supports: [professional-duty.sign-off-without-basis]
      - text: Only endorse documents either prepared under their supervision or within their areas of competence and with which they are in agreement.
        locator: Clause 4.02
        fetched: "2026-10-15"
        supports: [professional-duty.sign-off-without-basis]
      - text: Ensure adequate testing, debugging, and review of software and related documents on which they work.
        locator: Clause 3.10
        fetched: "2026-10-15"
        supports: [professional-duty.sign-off-without-basis]
      - text: Disclose to appropriate persons or authorities any actual or potential danger to the user, the public, or the environment, that they reasonably believe to be associated with software or related documents.
        locator: Clause 1.04
        fetched: "2026-10-15"
        supports: [professional-duty.suppress-danger-disclosure]
      - text: Identify, document, collect evidence and report to the client or the employer promptly if, in their opinion, a project is likely to fail, to prove too expensive, to violate intellectual property law, or otherwise to be problematic.
        locator: Clause 2.06
        fetched: "2026-10-15"
        supports: [professional-duty.suppress-danger-disclosure]
      - text: Keep private any confidential information gained in their professional work, where such confidentiality is consistent with the public interest and consistent with the law.
        locator: Clause 2.05
        fetched: "2026-10-15"
        supports: [professional-duty.suppress-danger-disclosure]
      - text: Be fair and avoid deception in all statements, particularly public ones, concerning software or related documents, methods and tools.
        locator: Clause 1.06
        fetched: "2026-10-15"
        supports: [professional-duty.deceptive-capability-claims]
      - text: Ensure realistic quantitative estimates of cost, scheduling, personnel, quality and outcomes on any project on which they work or propose to work and provide an uncertainty assessment of these estimates.
        locator: Clause 3.09
        fetched: "2026-10-15"
        supports: [professional-duty.deceptive-capability-claims]
  - id: acm-code
    title: ACM Code of Ethics and Professional Conduct (2018)
    url: https://www.acm.org/code-of-ethics
    adapter: web_page
