schema_version: 1
id: distributed-systems-omits-fault-model
kind: omission
twin: distributed-systems-omits-fault-model-clean
brief: |
  Project: shared scheduling service for five partner clinics, each running its own server.
  - The five servers replicate the appointment book and elect a leader to order bookings.
  - The service must keep working when something goes wrong at one clinic.
  - Booking requests are retried by the client for up to one minute, each with a request id the servers deduplicate.
  - Bookings are ordered by the leader's log sequence number.
  - Messages between servers are mutually authenticated with per-clinic certificates; only the five listed servers are members.
  - Patients book through a web form; staff use a desktop app.
expect:
  omissions:
  - distributed-systems.fault-model
