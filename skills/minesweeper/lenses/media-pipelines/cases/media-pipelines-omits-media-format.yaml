schema_version: 1
id: media-pipelines-omits-media-format
kind: omission
twin: media-pipelines-omits-media-format-clean
brief: |
  A school photography company - portrait retouching

  - Photographers upload class portraits; the service crops, colour-corrects and smooths skin.
  - Each worker container has an 8 GB memory limit and processes 2 portraits at a time.
  - Retouched portraits are ready for parent ordering within one hour.
  - Parents can request a re-take before the order deadline.
  - Originals are deleted 90 days after the order window closes.
expect:
  omissions:
  - media-pipelines.media-format
