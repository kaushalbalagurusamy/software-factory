schema_version: 1
id: media-pipelines-uncompressed-bandwidth-clean
kind: clean
twin: media-pipelines-uncompressed-bandwidth-planted
brief: |
  A sports broadcaster's analytics team - live player tracking

  - Four stadium cameras capture 3840 x 2160 at 60 frames per second, 10-bit 4:2:2, BT.709.
  - A tracking model locates players in each frame and overlays positions for the commentary team.
  - Decoding and tracking run on the same GPU host per camera, with frames kept in device memory; only player coordinates (under 10 KB per frame) are sent to the cloud.
  - Each tracking host has 64 GB RAM and processes one camera feed.
  - Overlays must lag the live picture by under 500 ms.
expect:
  none_from_lens: true
