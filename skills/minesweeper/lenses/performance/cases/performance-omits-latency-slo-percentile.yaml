id: performance-omits-latency-slo-percentile
kind: omission
twin: performance-omits-latency-slo-percentile-clean
brief: |
  Northwind Insurance - claims status API

  - Policyholders check the status of an open claim from the mobile app.
  - Load model: peak 800 requests per second, responses under 4 KB, up to 10,000 concurrent app sessions.
  - Status responses must come back in under 300 ms.
  - Infrastructure cost must stay under $0.0002 per request.
  - Status data is read from a replica refreshed every minute.
expect:
  omissions:
  - performance.latency-slo-percentile
