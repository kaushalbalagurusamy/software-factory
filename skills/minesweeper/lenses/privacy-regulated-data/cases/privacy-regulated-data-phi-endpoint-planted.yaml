schema_version: 1
id: privacy-regulated-data-phi-endpoint-planted
kind: planted
twin: privacy-regulated-data-phi-endpoint-clean
brief: |
  A regional clinic network: intake note summariser (US clinics)

  1. Nurses record the intake conversation; the audio is transcribed and summarised for the chart.
  2. Send the raw transcripts, including names, dates of birth and symptoms, to a general-purpose
     hosted model endpoint under its standard online terms.
  3. Summaries are stored in the clinic's EHR; transcripts are deleted after 30 days.
  4. Data is stored in US regions only.
  5. Clinicians approve every summary before it is filed.
expect:
  traps: [privacy-regulated-data.phi-to-general-model-endpoint]
  min_severity: critical
