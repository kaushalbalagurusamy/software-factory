id: privacy-regulated-data-processors-omission-clean
kind: clean
twin: privacy-regulated-data-processors-omission
brief: |
  Contoso Care Line: telehealth appointment notes (US and EU patients)

  1. Data processed: patient name, contact details, appointment reason and clinician notes (health data).
  2. Notes are transcribed by an external speech-to-text service and summarised by an external model API;
     both are covered by signed business associate agreements and Article 28 processor contracts.
  3. Data is stored in US and EU regions matching the patient's location; notes kept for 7 years.
  4. Clinicians sign off each note.
expect:
  none_from_lens: true
