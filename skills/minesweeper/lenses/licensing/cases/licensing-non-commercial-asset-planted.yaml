brief: |
  Fabrikam Retail: paid product-photo tagging API

  1. Fine-tune an image classifier and sell access per 1,000 calls; served from our cloud only.
  2. Training data: the large public product-image dataset from a university lab, released under
     CC BY-NC 4.0; it is free to download, so use all of it.
  3. Record the SPDX licence of each model checkpoint and dataset in the model card.
  4. Target 92 percent top-1 accuracy on the held-out set.
  5. p95 latency under 150 ms.
expect:
  traps: [licensing.non-commercial-asset-in-paid-product]
  min_severity: critical
