  - id: rfc9293
    title: RFC 9293 Transmission Control Protocol (TCP)
    url: https://www.rfc-editor.org/rfc/rfc9293.txt
    adapter: web_page
    tier: primary
    kind: standard
    quotes:
      - text: To support this, the TIME-WAIT state limits the rate of connection reuse
        locator: Section 3.4.1 (Initial Sequence Number Selection)
