    url: https://man7.org/linux/man-pages/man2/getrlimit.2.html
    adapter: web_page
    tier: primary
    kind: docs
    quotes:
      - text: This specifies a value one greater than the maximum file descriptor number that can be opened by this process. Attempts (open(2), pipe(2), dup(2), etc.) to exceed this limit yield the error EMFILE.
        locator: RLIMIT_NOFILE
        fetched: "2026-10-14"
        supports: [os-systems.fd-limit-exhaustion]
