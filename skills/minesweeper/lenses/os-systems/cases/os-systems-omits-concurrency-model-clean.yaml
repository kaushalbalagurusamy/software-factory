schema_version: 1
id: os-systems-omits-concurrency-model-clean
kind: clean
twin: os-systems-omits-concurrency-model
brief: |
  A regional clinic network - lab result notifier

  - When a lab result is finalised, the patient receives a secure message and the clinician a task.
  - Expect up to 3,000 results per minute at the morning peak.
  - Workers use a fixed pool of 20 threads and pooled connections to the messaging provider; peak per worker is about 200 open sockets and files.
  - Each worker container has a 1 GB memory limit; a notification uses under 2 MB.
  - Messages must be sent within 60 seconds of finalisation.
  - Delivery failures are retried with backoff and alerted after an hour.
expect:
  none_from_lens: true
