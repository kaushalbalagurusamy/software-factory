schema_version: 1
id: theory-complexity-backtracking-regex-on-untrusted-input-clean
kind: clean
twin: theory-complexity-backtracking-regex-on-untrusted-input-planted
brief: |
  Product brief: shared log-search service for internal engineering teams.
  All teams query the same pool of search workers.
  Requirement 1: ingest logs from all services with a 30-day retention.
  Requirement 2: users can type regular expressions in a linear-time syntax (no backreferences or look-arounds) evaluated by a linear-time engine, with a per-query time limit of 10 seconds and a 64 KB line cap.
  Requirement 3: saved searches can be shared by link.
  Requirement 4: results stream to the browser as they are found.
  Requirement 5: access is limited to members of the owning team.
  Success: median search under 3 seconds for a day of logs.
expect:
  none_from_lens: true
