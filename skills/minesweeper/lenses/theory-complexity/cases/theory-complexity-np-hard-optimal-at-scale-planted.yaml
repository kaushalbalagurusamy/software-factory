brief: |
  Product brief: dispatch planner for a regional field-service company.
  Dispatchers manage about 400 technicians and 1,500 customer sites per day.
  Each job has a time window, a required skill and an estimated duration.
  Requirement 1: import the day's jobs from the existing CSV export each morning.
  Requirement 2: when a job is added or cancelled, the planner returns the best possible routes and assignments for all technicians within 200 ms, every time, so nobody ever drives a longer route than necessary.
  Requirement 3: dispatchers can drag a job to another technician and see the new route.
  Requirement 4: show each technician's route on a map in the mobile app.
  Requirement 5: keep an audit log of every manual reassignment.
  Success: fewer late arrivals and less overtime than the current manual process.
expect:
