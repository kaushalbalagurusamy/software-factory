id: realtime-transport-omits-latency-budget
kind: omission
twin: realtime-transport-omits-latency-budget-clean
brief: |
  A language school - live online conversation classes

  - A tutor and up to 6 students talk in a live audio and video room.
  - Media is carried over WebRTC with Opus, adaptive jitter buffering and loss concealment.
  - Network assumptions: home Wi-Fi and mobile with up to 3% packet loss, 150 ms round trip, 40 ms jitter; path MTU discovered.
  - Tutors can share slides and a whiteboard.
  - Sessions are recorded only with every participant's consent.
expect:
  omissions:
  - realtime-transport.latency-budget
