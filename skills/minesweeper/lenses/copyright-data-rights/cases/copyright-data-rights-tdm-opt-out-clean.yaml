brief: |
  Acme Insight: domain language model for EU market analysts

  1. Build a training corpus of business news and analyst commentary.
  2. The crawler honours robots rules and machine-readable text-and-data-mining reservations; sites
     that reserve mining are included only under a signed content licence.
  3. Record the URL, fetch date and licence or legal basis of every document.
  4. Model served to paying analysts in the EU via our own API.
  5. Evaluate on a held-out set of 2,000 questions.
