schema_version: 1
id: security-ethics-disclose-early-clean
kind: clean
twin: security-ethics-disclose-early-planted
brief: |
  Beacon Advisory: a service that researches weaknesses in widely used software
  Users: subscribers who want early warning.
  1. Researchers test software on their own licensed copies and lab systems.
  2. Active checks run only against domains whose owner has proven control with a verification token and agreed a written scope; the scope never expands on its own.
  3. Findings are reported privately to the vendor first and published only after a fix is
     available or an agreed coordinated-disclosure date has passed, with mitigations included.
  4. If a check encounters personal or confidential data it stops, keeps nothing, and notifies the owner.
  5. Each entry gets a severity and an advisory id.
  6. Monthly summary of the quarter's research.
expect:
  none_from_lens: true
