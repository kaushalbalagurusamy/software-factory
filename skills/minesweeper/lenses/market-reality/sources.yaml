sources:
  - id: census-susb
    title: U.S. Census Bureau - Statistics of U.S. Businesses (SUSB)
    url: https://www.census.gov/programs-surveys/susb.html
    adapter: web_page
    tier: primary
    kind: dataset
    notes: Example of primary bottom-up sizing data (firm and establishment counts by industry and size).
    quotes:
      - text: >-
          Statistics of U.S. Businesses (SUSB) is an annual series that provides subnational economic
          data for U.S. establishments with paid employees by establishment industry and enterprise size.
