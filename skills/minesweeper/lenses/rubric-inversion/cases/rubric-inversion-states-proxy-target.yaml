brief: |
  Assessment brief: a reading-comprehension tutor app for secondary pupils.
  Submissions are scored by an automated rubric.
  Rubric item 1: number of practice questions the app generates per text, capped at 20, as a proxy for how much useful practice a pupil gets; with a deduction for each question a teacher marks as unanswerable from the text.
  Rubric item 2: the app works offline.
  Deliverable: app build and a short report.
