brief: |
  Assessment brief: build a contract summarisation assistant for a legal operations team.
  Submissions are scored by an automated rubric.
  Rubric item 1: summaries must cite the clause each point comes from.
  Rubric item 2: the score rises with compression: the shorter the summary relative to the contract, the more points awarded.
  Rubric item 3: latency under 10 seconds per contract.
  Rubric item 4: a short design note explaining the approach.
  Deliverable: a working service and the design note.
