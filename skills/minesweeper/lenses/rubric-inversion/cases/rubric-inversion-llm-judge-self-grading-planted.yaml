brief: |
  Assessment brief: customer-support answer bot for a software product.
  The bot answers from the product documentation.
  Requirement 1: answers cite the documentation page they used.
  Requirement 2: answer quality is scored by asking the same model that generated each answer to rate it from 1 to 10; release when the average exceeds 8.
  Requirement 3: answers stay under 200 words.
  Deliverable: the bot, the evaluation script and its results.
