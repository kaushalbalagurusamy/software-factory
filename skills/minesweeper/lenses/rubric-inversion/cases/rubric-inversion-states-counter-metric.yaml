brief: |
  Team brief: improving the internal developer platform this quarter.
  Goal: help product teams ship changes faster without more incidents.
  KPI: deployments per team per week, which stands in for how quickly teams deliver changes; paired with change failure rate and incidents per deployment, which must not rise.
  The platform team is reviewed on both measures at the end of the quarter.
  Work items: faster CI, one-click rollback, preview environments.
  Deliverable: a quarterly report on both measures.
