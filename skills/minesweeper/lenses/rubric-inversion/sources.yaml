    title: Manheim, Garrabrant, Categorizing Variants of Goodhart's Law (2018)
    url: https://arxiv.org/abs/1803.04585
    adapter: paper
    tier: primary
    kind: paper
    notes: The common phrasing "when a measure becomes a target, it ceases to be a good measure" is Strathern's (1997) paraphrase, not Goodhart's own wording; do not quote it as Goodhart.
    quotes:
      - text: This occurs when a metric which can be used to improve a system is used to an extent that further optimization is ineffective or harmful, and is sometimes termed Goodhart's Law.
        locator: Abstract
        fetched: "2026-10-14"
        supports: [rubric-inversion.proxy-metric-as-target]
