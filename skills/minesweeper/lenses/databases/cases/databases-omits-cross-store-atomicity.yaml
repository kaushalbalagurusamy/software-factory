schema_version: 1
id: databases-omits-cross-store-atomicity
kind: omission
twin: databases-omits-cross-store-atomicity-clean
brief: |
  Project: appointment booking for a network of physiotherapy practices.
  - Bookings are stored in a single-region relational database; all reads and writes go to the primary.
  - If the database is unreachable, booking shows an error and nothing is written.
  - Booking a slot runs as a SERIALIZABLE transaction retried on conflict.
  - Each booking is also pushed to the practice's calendar service and the reminder queue.
  - Patients receive a reminder the day before.
expect:
  omissions:
  - databases.cross-store-atomicity
