schema_version: 1
id: numeric-representation-money-in-binary-float-clean
kind: clean
twin: numeric-representation-money-in-binary-float-planted
brief: |
  Product brief: premium billing service for a small insurance broker.
  Policies have an annual premium charged monthly, pro-rated by day on mid-month changes.
  All timestamps are stored in UTC; each customer's IANA time zone is stored for display.
  Ids and counters are 64-bit integers; arithmetic on them fails loudly on overflow.
  Requirement 1: generate a monthly invoice per policy holder.
  Requirement 2: premiums, pro-rated amounts and balances are stored as integer cents with the currency code; pro-rating uses decimal arithmetic with round-half-even to the cent, and the rounding remainder goes to the final instalment of the year.
  Requirement 3: a nightly job totals all invoices across worker processes for the finance report.
  Requirement 4: finance can export the ledger as CSV.
  Success: month-end reconciliation takes one day instead of five.
expect:
  none_from_lens: true
