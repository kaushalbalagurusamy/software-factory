schema_version: 1
id: numeric-representation-fixed-width-counter-overflow-planted
kind: planted
twin: numeric-representation-fixed-width-counter-overflow-clean
brief: |
  Product brief: event ingestion API for a mobile analytics service.
  Customers send app events; the service expects to reach 40 million events per day within two years.
  All timestamps are stored in UTC.
  There is no money handling in this service.
  Requirement 1: accept batches of events over HTTPS.
  Requirement 2: each event gets a sequential id from a 32-bit signed integer column, and the lifetime total per customer is kept in a 32-bit int counter.
  Requirement 3: customers see daily and lifetime event totals.
  Success: customers can query yesterday's events by 06:00 UTC.
expect:
  traps:
  - numeric-representation.fixed-width-counter-overflow
  min_severity: high
