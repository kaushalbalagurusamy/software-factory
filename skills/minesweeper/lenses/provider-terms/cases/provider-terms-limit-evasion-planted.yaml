schema_version: 1
id: provider-terms-limit-evasion-planted
kind: planted
twin: provider-terms-limit-evasion-clean
brief: |
  Northwind Catalogue Enrichment: batch product description writer

  1. Generate descriptions for 4 million products overnight with a hosted model on the paid API tier.
  2. Our single account's per-minute limit is too low, so register a dozen more developer accounts
     and rotate their keys round-robin to multiply throughput.
  3. Only product attributes are sent; no personal data.
  4. Generated text is stored in the catalogue and shown to shoppers.
  5. Retry failed calls up to three times.
expect:
  traps: [provider-terms.limit-evasion-multi-account]
  min_severity: high
