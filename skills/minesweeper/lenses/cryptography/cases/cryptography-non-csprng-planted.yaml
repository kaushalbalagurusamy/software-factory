schema_version: 1
id: cryptography-non-csprng-planted
kind: planted
twin: cryptography-non-csprng-clean
brief: |
  A ticketing site issues password-reset links and API keys for event organisers.
  - Backend in Python; links expire after 30 minutes and are single use.
  - The reset token and the API keys are produced with the random module, seeded from the current time
    at startup so they are reproducible in tests.
  - Reset requests are rate-limited per account and per IP.
  - Keys can be revoked from the organiser dashboard.
expect:
  traps:
  - cryptography.non-csprng
  min_severity: high
