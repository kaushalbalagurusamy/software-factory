  - id: nist-ir8547
    title: NIST IR 8547 (initial public draft) - Transition to Post-Quantum Cryptography Standards
    url: https://csrc.nist.gov/pubs/ir/8547/ipd
    adapter: web_page
    tier: primary
    kind: guidance
    quotes:
      - text: "This report describes NIST’s expected approach to transitioning from quantum-vulnerable cryptographic algorithms to post-quantum digital signature algorithms and key-establishment schemes."
        locator: Abstract
        fetched: "2026-10-14"
        supports: [cryptography.quantum-vulnerable-long-term-secrecy]
  - id: rfc9881
    title: RFC 9881 - Algorithm Identifiers for ML-DSA in Internet X.509 Public Key Infrastructure
    url: https://www.rfc-editor.org/rfc/rfc9881.txt
    adapter: web_page
    tier: primary
    kind: standard
    notes: Sizes are raw values from Table 2 (ML-DSA-44, -65, -87 at NIST levels 2, 3, 5), excluding ASN.1 encoding overhead.
    quotes:
      - text: "listed in Table 2, along with the resulting signature size, public key, and private key sizes in bytes."
        locator: Section on ML-DSA parameter sets, Table 2
        fetched: "2026-10-14"
        supports: [cryptography.pq-signature-size-mtu]
      - text: "| 2 | (4,4) | 2 | 2420 | 1312 | 32 | 2560 |"
        locator: Table 2 (NIST level 2 row - signature 2420 bytes, public key 1312 bytes)
        fetched: "2026-10-14"
        supports: [cryptography.pq-signature-size-mtu]
  - id: nist-sp800-208
    title: NIST SP 800-208 - Recommendation for Stateful Hash-Based Signature Schemes
    url: https://csrc.nist.gov/pubs/sp/800/208/final
    adapter: web_page
    tier: primary
    kind: standard
    quotes:
      - text: "This recommendation specifies two algorithms that can be used to generate a digital signature, both of which are stateful hash-based signature schemes: the Leighton-Micali Signature (LMS) system and the eXtended Merkle Signature Scheme (XMSS)"
        locator: Abstract
        fetched: "2026-10-14"
        supports: [cryptography.stateful-hbs-state-reuse]
  - id: rfc8554
    title: RFC 8554 - Leighton-Micali Hash-Based Signatures
    url: https://www.rfc-editor.org/rfc/rfc8554.txt
    adapter: web_page
    tier: primary
    kind: standard
    quotes:
      - text: "The LMS signature system, like all N-time signature systems, requires that the signer maintain state across different invocations of the signing algorithm to ensure that none of the component one-time signature systems are used more than once."
        locator: Section 9.2 Stateful Signature Algorithm
        fetched: "2026-10-14"
        supports: [cryptography.stateful-hbs-state-reuse]
  - id: rfc8391
    title: RFC 8391 - XMSS - eXtended Merkle Signature Scheme
    url: https://www.rfc-editor.org/rfc/rfc8391.txt
    adapter: web_page
    tier: primary
    kind: standard
    quotes:
      - text: "If a secret key state is used twice, no cryptographic security guarantees remain."
        locator: Section 1 Introduction
        fetched: "2026-10-14"
        supports: [cryptography.stateful-hbs-state-reuse]
  - id: rfc9802
    title: RFC 9802 - Use of the HSS and XMSS Hash-Based Signature Algorithms in Internet X.509 PKI
    url: https://www.rfc-editor.org/rfc/rfc9802.txt
    adapter: web_page
    tier: primary
    kind: standard
    quotes:
      - text: "If an attacker were able to obtain signatures for two different messages created using the same OTS key, then it would become computationally feasible for that attacker to create forgeries"
        locator: Section 10 Security Considerations
        fetched: "2026-10-14"
        supports: [cryptography.stateful-hbs-state-reuse]
