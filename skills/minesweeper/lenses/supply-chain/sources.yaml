schema_version: 1
sources:
  - id: spracklen-2024-package-hallucination
    title: "We Have a Package for You! A Comprehensive Analysis of Package Hallucinations by Code Generating LLMs (Spracklen et al., USENIX Security 2025)"
    url: https://arxiv.org/abs/2406.10279
    adapter: paper
    tier: primary
    kind: paper
    quotes:
      - text: "These hallucinations, which arise from fact-conflicting errors when generating code using LLMs, represent a novel form of package confusion attack that poses a critical threat to the integrity of the software supply chain."
        locator: Abstract
        fetched: "2026-10-14"
        supports: [supply-chain.unverified-package-name, supply-chain.autonomous-agent-install]
      - text: "Our findings reveal that that the average percentage of hallucinated packages is at least 5.2% for commercial models and 21.7% for open-source models, including a staggering 205,474 unique examples of hallucinated package names"
        locator: Abstract
        fetched: "2026-10-14"
        supports: [supply-chain.unverified-package-name]
    notes: >-
      The abstract page carries the headline rates only. The report's recurrence figures (43% in all ten
      runs, 58% more than once), the 38%/49%/13% category split and the 8.7% cross-registry figure are
      in the paper body and were not confirmed from the fetched text; do not quote them as facts.
  - id: slsa-threats
    title: SLSA specification v1.0 - Threats and mitigations
    url: https://slsa.dev/spec/v1.0/threats
    adapter: web_page
    tier: primary
    kind: spec
    quotes:
      - text: "Threat: Register a package name that is similar looking to a popular package and get users to use your malicious package instead of the benign one."
        locator: Package threats - Typosquatting
        fetched: "2026-10-14"
        supports: [supply-chain.unverified-package-name]
      - text: "You may be able to mitigate this threat by pinning your build dependencies, preferably by digest rather than version number."
        locator: Dependency threats - (D) Use compromised build dependency
        fetched: "2026-10-14"
        supports: [supply-chain.unpinned-dependencies]
      - text: "SLSA mitigates dependency threats when you verify your dependencies’ SLSA provenance."
        locator: Dependency threats
        fetched: "2026-10-14"
        supports: [supply-chain.unverified-provenance]
  - id: slsa-provenance
