schema_version: 1
sources:
  - id: eu-ai-act
    title: Regulation (EU) 2024/1689 (Artificial Intelligence Act), Official Journal text
    url: https://publications.europa.eu/resource/cellar/dc8116a1-3fe6-11ef-865a-01aa75ed71a1.0006.03/DOC_1
    adapter: web_page
    tier: primary
    kind: regulation
    notes: >-
      EU Publications Office (Cellar) English XHTML manifestation of CELEX 32024R1689, the same Official
      Journal text EUR-Lex serves. EUR-Lex HTML returns an HTTP 202 bot challenge to automated fetches.
      This is the text as adopted; read it together with eu-ai-omnibus for amended dates.
    quotes:
      - text: the placing on the market, the putting into service for this specific purpose, or the use of AI systems to infer emotions of a natural person in the areas of workplace and education institutions, except where the use of the AI system is intended to be put in place or into the market for medical or safety reasons;
        locator: Article 5(1)(f)
        fetched: "2026-10-14"
        supports: [ai-regulation.emotion-inference-work-education]
      - text: the placing on the market, the putting into service for this specific purpose, or the use of AI systems that create or expand facial recognition databases through the untargeted scraping of facial images from the internet or CCTV footage;
        locator: Article 5(1)(e)
        fetched: "2026-10-14"
        supports: [ai-regulation.untargeted-face-scraping]
      - text: Non-compliance with the prohibition of the AI practices referred to in Article 5 shall be subject to administrative fines of up to EUR 35 000 000 or, if the offender is an undertaking, up to 7 % of its total worldwide annual turnover for the preceding financial year, whichever is higher.
        locator: Article 99(3)
        fetched: "2026-10-14"
        supports: [ai-regulation.emotion-inference-work-education, ai-regulation.untargeted-face-scraping]
      - text: Chapters I and II shall apply from 2 February 2025;
        locator: Article 113, third paragraph, point (a)
        fetched: "2026-10-14"
        supports: [ai-regulation.emotion-inference-work-education, ai-regulation.untargeted-face-scraping]
      - text: In addition to the high-risk AI systems referred to in paragraph 1, AI systems referred to in Annex III shall be considered to be high-risk.
        locator: Article 6(2)
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: AI systems intended to be used for the recruitment or selection of natural persons, in particular to place targeted job advertisements, to analyse and filter job applications, and to evaluate candidates;
        locator: Annex III, point 4(a)
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: AI systems intended to be used to evaluate the creditworthiness of natural persons or establish their credit score, with the exception of AI systems used for the purpose of detecting financial fraud;
        locator: Annex III, point 5(b)
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: AI systems intended to be used to evaluate learning outcomes, including when those outcomes are used to steer the learning process of natural persons in educational and vocational training institutions at all levels;
        locator: Annex III, point 3(b)
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: High-risk AI systems shall technically allow for the automatic recording of events (logs) over the lifetime of the system.
        locator: Article 12(1)
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: High-risk AI systems shall be designed and developed in such a way, including with appropriate human-machine interface tools, that they can be effectively overseen by natural persons during the period in which they are in use.
        locator: Article 14(1)
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: Deployers shall assign human oversight to natural persons who have the necessary competence, training and authority, as well as the necessary support.
        locator: Article 26(2)
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: Deployers of high-risk AI systems shall keep the logs automatically generated by that high-risk AI system to the extent such logs are under their control, for a period appropriate to the intended purpose of the high-risk AI system, of at least six months
        locator: Article 26(6)
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: Providers shall ensure that AI systems intended to interact directly with natural persons are designed and developed in such a way that the natural persons concerned are informed that they are interacting with an AI system, unless this is obvious from the point of view of a natural person who is reasonably well-informed, observant and circumspect, taking into account the circumstances and the context of use.
        locator: Article 50(1)
        fetched: "2026-10-14"
        supports: [ai-regulation.undisclosed-ai-interaction]
      - text: It shall apply from 2 August 2026.
        locator: Article 113, second paragraph
        fetched: "2026-10-14"
        supports: [ai-regulation.undisclosed-ai-interaction]
  - id: eu-ai-omnibus
    title: Regulation (EU) 2026/1744 (Digital Omnibus on AI), Official Journal text
    url: https://publications.europa.eu/resource/cellar/b459c07f-86fb-11f1-bf5e-01aa75ed71a1.0006.03/DOC_1
    adapter: web_page
    tier: primary
    kind: regulation
    notes: >-
      EU Publications Office (Cellar) English XHTML of CELEX 32026R1744, OJ L 24.7.2026, which amends
      Regulation (EU) 2024/1689 including the Article 113 application dates for high-risk obligations.
    quotes:
      - text: amending Regulations (EU) 2024/1689, (EU) 2018/1139 and (EU) 2023/1230 as regards the simplification of the implementation of harmonised rules on artificial intelligence (Digital Omnibus on AI)
        locator: Title
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: 2 December 2027 as regards AI systems classified as high-risk pursuant to Article 6(2) and Annex III; and
        locator: Article 1, amendment to Article 113, third paragraph, point (c)(i) of Regulation (EU) 2024/1689
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
      - text: 2 August 2028 as regards AI systems classified as high-risk pursuant to Article 6(1) and Annex I;
        locator: Article 1, amendment to Article 113, third paragraph, point (c)(ii) of Regulation (EU) 2024/1689
        fetched: "2026-10-14"
        supports: [ai-regulation.annex-iii-without-oversight-or-logs]
