<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>lsf dashboard</title>
<style>
:root{--bg:#f4f5f8;--panel:#ffffff;--panel2:#eef0f5;--fg:#171a21;--mute:#5a6275;--line:#d8dce6;--acc:#3b5bdb;--acc-fg:#ffffff;
--align:#3b5bdb;--build:#0b8f6a;--review:#8e44c9;--ok:#0b7a4b;--warn:#a15c00;--bad:#c0262d;--wait:#a15c00;--shadow:0 1px 2px rgba(20,25,40,.06),0 6px 20px rgba(20,25,40,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1017;--panel:#151a24;--panel2:#1b2230;--fg:#e8ebf2;--mute:#9aa4b8;--line:#2a3345;--acc:#7c9bff;--acc-fg:#0d1017;
--align:#7c9bff;--build:#4fd1a5;--review:#c49bff;--ok:#56d39a;--warn:#f0b64a;--bad:#ff7a82;--wait:#f0b64a;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-width:0}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:1.05rem;margin:1.4rem 0 .6rem;letter-spacing:.01em}
h3{font-size:.98rem}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;overflow-x:auto;max-width:100%}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--panel);padding:.5rem;z-index:20}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding:.7rem 16px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:.6rem;min-width:0}
.brand b{font-size:1.25rem;letter-spacing:.02em}
.brand span{color:var(--mute);font-size:.88rem}
.clock{display:flex;align-items:center;gap:.7rem;min-width:0}
.clock .t{font:600 1.35rem/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.clock .l{color:var(--mute);font-size:.8rem;line-height:1.2}
.settings{display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center;font-size:.82rem;color:var(--mute)}
.settings input,.settings select{min-width:0;max-width:100%}.settings input{flex:1 1 160px}
input,select,button{font:inherit;color:var(--fg)}
input,select{min-height:44px;padding:.25rem .6rem;background:var(--panel);border:1px solid var(--line);border-radius:10px}
button{min-height:44px;padding:.35rem .9rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:650}
button:disabled{opacity:.55;cursor:default}
#banner{margin:0;padding:.55rem 16px;font-weight:600;font-size:.92rem;text-align:center}
#banner:empty,#waiting:empty{display:none}
#waiting{margin:0;padding:.55rem 16px;font-weight:650;font-size:.95rem;text-align:center;background:color-mix(in srgb,var(--wait) 22%,var(--bg));border-bottom:1px solid var(--wait)}
#waiting a{margin-left:.6rem;white-space:nowrap}
#banner.stop{background:color-mix(in srgb,var(--wait) 18%,var(--bg));border-bottom:1px solid var(--wait)}
#banner.snap{background:color-mix(in srgb,var(--acc) 15%,var(--bg));border-bottom:1px solid var(--acc)}
#banner.err{background:color-mix(in srgb,var(--bad) 18%,var(--bg));border-bottom:1px solid var(--bad)}
nav{display:flex;gap:.3rem;overflow-x:auto;padding:.4rem 16px;max-width:1180px;margin:0 auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav button{white-space:nowrap;border-color:transparent;background:transparent;color:var(--mute);border-radius:999px;padding:.35rem .95rem}
nav button[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--fg);font-weight:650;box-shadow:var(--shadow)}
nav .dot{display:inline-block;min-width:1.2em;padding:0 .35em;margin-left:.4em;border-radius:99px;background:var(--wait);color:#000;font-size:.75rem;font-weight:700;text-align:center}
main{padding:8px 16px 64px;max-width:1180px;margin:0 auto;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin:.7rem 0;box-shadow:var(--shadow);overflow-wrap:anywhere;min-width:0}
.card.stop{border-color:var(--wait);border-left-width:5px}
.card.done{opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.7rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:.6rem}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem}
.tile b{display:block;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--mute);font-size:.8rem}
.mute{color:var(--mute)}.small{font-size:.85rem}
.chip{display:inline-block;padding:.05rem .55rem;border-radius:99px;font-size:.76rem;font-weight:650;border:1px solid currentColor;white-space:nowrap}
.g-align{color:var(--align)}.g-build{color:var(--build)}.g-review{color:var(--review)}
.v-pass{color:var(--ok)}.v-fail{color:var(--bad)}.v-wait{color:var(--wait)}.v-mute{color:var(--mute)}
.steps{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 0;padding:0;list-style:none}
.steps li{padding:.2rem .65rem;border-radius:99px;border:1px solid var(--line);font-size:.8rem;color:var(--mute);background:var(--panel2)}
.steps li.done{color:var(--fg)}.steps li.done::before{content:"\2713 "}
.steps li.open{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:700}
.opts{border:0;margin:.7rem 0 0;padding:0;display:grid;gap:.45rem}
.opts legend{padding:0;font-size:.85rem;color:var(--mute);margin-bottom:.3rem}
.opt{display:flex;align-items:center;gap:.7rem;min-height:48px;padding:.4rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;overflow-wrap:anywhere}
.opt:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel2))}
.opt input{flex:none;width:22px;height:22px;min-height:0;accent-color:var(--acc)}
.refu{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.clk{cursor:pointer}.clk:focus-visible{outline:3px solid var(--acc);outline-offset:-2px;border-radius:8px}
.logp{margin-top:.6rem;cursor:auto}
pre.logpre{max-height:50vh;overflow:auto;white-space:pre;margin:.4rem 0 0;-webkit-overflow-scrolling:touch}
.logpre a{color:var(--acc);text-decoration:underline;min-height:0}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:.25rem .8rem;margin:.6rem 0 0;font-size:.9rem}
.dl dt{color:var(--mute)}.dl dd{margin:0;overflow-wrap:anywhere;min-width:0}
.dec .note{flex:1 1 220px;min-width:0}
.dec button.primary{flex:1 1 160px}
.gb{margin:.9rem 0}
.wrows{display:flex;flex-direction:column;gap:.35rem;margin-top:.6rem}
.gb .row{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;font-size:.9rem}
.track{position:relative;height:16px;border-radius:99px;background:var(--panel2);margin:.35rem 0}
.plan{position:absolute;left:0;top:0;bottom:0;border:2px dashed var(--mute);border-radius:99px;opacity:.55}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .6s ease}
.fill.g-align{background:var(--align)}.fill.g-build{background:var(--build)}.fill.g-review{background:var(--review)}
.fill.over{box-shadow:0 0 0 2px var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.78rem;color:var(--mute)}
.q{font-size:1.15rem;font-weight:650;margin:.2rem 0 .5rem}
.refs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.ref{display:inline-flex;align-items:center;flex-wrap:wrap;gap:.4rem;max-width:100%;min-width:0}
a.elink,.ref.plain{display:inline-flex;align-items:center;min-height:44px;padding:0 .7rem;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-decoration:none;max-width:100%;overflow-wrap:anywhere}
.ref button{min-height:44px;padding:0 .6rem;font-size:.8rem}
.row2{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
.err{color:var(--bad)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:.6rem 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.list li:last-child{border-bottom:0}
.ev{display:grid;grid-template-columns:5.2rem 1fr;gap:.2rem .7rem}
.ev time{color:var(--mute);font:.8rem ui-monospace,Menlo,monospace}
details{border:1px solid var(--line);border-radius:12px;padding:.2rem .9rem;margin:.5rem 0;background:var(--panel)}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;gap:.5rem}
iframe{width:100%;height:68vh;min-height:360px;border:1px solid var(--line);border-radius:12px;background:#fff}
.md h1,.md h2,.md h3{margin:1rem 0 .4rem}.md p{margin:.4rem 0}.md ul{padding-left:1.2rem}
.empty{padding:1.2rem;border:1px dashed var(--line);border-radius:14px;color:var(--mute);background:var(--panel)}
.tbl{display:grid;gap:.4rem}
.hbar{height:10px;border-radius:99px;background:var(--acc);min-width:2px}
@media (max-width:620px){header.top{position:static}}
@media (max-width:520px){.dl{grid-template-columns:1fr}.dl dt{margin-top:.3rem}.clock .t{font-size:1.15rem}.bar{padding:.55rem 16px}.q{font-size:1.05rem}.ev{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
 <div class="bar">
  <div class="brand"><b>lsf</b><span>lite software factory</span></div>
  <div class="clock" role="timer" aria-live="off"><div class="t" id="clk">--:--</div><div class="l" id="clkl">loading</div></div>
  <div class="settings">
   <label for="ed">Editor</label><select id="ed"></select>
   <label for="ws">Workspace root</label><input id="ws" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="/absolute/path/to/project" size="22">
  </div>
 </div>
 <p id="waiting" role="status"></p>
 <p id="banner" role="status"></p>
 <nav id="nav" role="tablist" aria-label="Dashboard tabs"></nav>
</header>
<main id="main" tabindex="-1"></main>
<script>
/* editor-links:begin */
var SFEditorLinks = (function (root, factory) {
  var api = factory();
  if (typeof module === "object" && module && module.exports) { module.exports = api; }
  else if (root) { root.SFEditorLinks = api; }
  return api;
})(typeof window !== "undefined" ? window : null, function () {
  var MAX_PATH = 4096, MAX_LINE = 10000000;
  var EDITORS = ["vscode", "cursor", "windsurf", "antigravity-ide", "zed", "idea", "sublime", "textmate"];
  function encSeg(s) { return s.split("/").map(encodeURIComponent).join("/"); }
  function encRoot(r) {
    var m = /^([A-Za-z]:)(\/.*)?$/.exec(r);
    return m ? m[1] + encSeg(m[2] || "") : encSeg(r);
  }
  function lineOf(line) {
    var n;
    if (typeof line === "number") { n = line; }
    else if (typeof line === "string" && /^[0-9]+$/.test(line)) { n = parseInt(line, 10); }
    else { return null; }
    if (isFinite(n) && Math.floor(n) === n && n >= 1 && n <= MAX_LINE) { return n; }
    return null;
  }
  function normRoot(r) {
    var n, i, segs, drive;
    if (typeof r !== "string" || r.length === 0 || r.length > MAX_PATH || r.indexOf("\0") >= 0) { return null; }
    drive = /^[A-Za-z]:[\\\/]/.test(r);
    if (!drive && (r.indexOf("\\") >= 0 || r.charAt(0) !== "/")) { return null; }
    n = drive ? r.replace(/\\/g, "/") : r;
    if (n.charAt(n.length - 1) === "/") { n = n.slice(0, -1); }
    segs = n.slice(drive ? 3 : 1).split("/");
    if (n.length === (drive ? 2 : 0)) { return n; }
    for (i = 0; i < segs.length; i++) { if (segs[i] === "" || segs[i] === ".") { return null; } }
    return n;
  }
  function validRoot(r) { return normRoot(r) !== null; }
  function validRel(p) {
    var i, segs;
    if (typeof p !== "string" || p.length === 0 || p.length > MAX_PATH) { return false; }
    if (p.indexOf("\0") >= 0 || p.indexOf("\\") >= 0 || p.charAt(0) === "/") { return false; }
    if (/^[A-Za-z0-9+.\-]+:/.test(p)) { return false; }
    segs = p.split("/");
    for (i = 0; i < segs.length; i++) { if (segs[i] === ".." || segs[i] === "." || segs[i] === "") { return false; } }
    return true;
  }
  function build(editor, rootDir, relPath, line) {
    var base, abs, n, q, i, found = false;
    if (typeof editor !== "string") { return null; }
    for (i = 0; i < EDITORS.length; i++) { if (EDITORS[i] === editor) { found = true; } }
    if (!found || !validRoot(rootDir) || !validRel(relPath)) { return null; }
    base = normRoot(rootDir);
    n = lineOf(line);
    if (editor === "idea") {
      return "idea://open?file=" + encodeURIComponent(base + "/" + relPath) + (n ? "&line=" + n : "");
    }
    abs = encRoot(base) + "/" + encSeg(relPath);
    q = n ? "&line=" + n : "";
    if (editor === "sublime") { return "subl://open?url=file://" + abs + q; }
    if (editor === "textmate") { return "txmt://open?url=file://" + abs + q; }
    return editor + "://file/" + abs.replace(/^\//, "") + (n ? ":" + n : "");
  }
  function editorUrl(editor, rootDir, relPath, line) {
    try { return build(editor, rootDir, relPath, line); } catch (e) { return null; } // a lone surrogate makes encodeURIComponent throw
  }
  return { editorUrl: editorUrl, editors: EDITORS.slice(), validRoot: validRoot };
});
/* editor-links:end */

</script>
<script>
(function(){
"use strict";
var TABS=[["now","Now"],["stops","Human stops"],["telemetry","Telemetry"],["research","Research"],["experiments","Experiments"],["adrs","ADRs"],["prd","PRD"],["architecture","Architecture"],["docs","Docs"],["evals","Evals & bugs"],["git","Git"]];
var GROUPS=["align","review","build"];
var S={state:null,snap:null,tab:"now",token:"",editor:null,wsroot:null,openDoc:null,docText:{},err:"",busy:{},sig:"",gotAt:0,iframe:{},draft:{},openLog:{}};
var main=document.getElementById("main"),nav=document.getElementById("nav");
try{var m=/token=([0-9a-f]+)/.exec(location.hash||"");if(m){S.token=m[1];history.replaceState(null,"",location.pathname+location.search);}}catch(e){}
function tabFromHash(){var id=(location.hash||"").replace(/^#/,"");for(var i=0;i<TABS.length;i++){if(TABS[i][0]===id){return id;}}return "now";}
S.tab=tabFromHash();
function store(k,v){try{if(v===undefined){return localStorage.getItem("lsf."+k);}localStorage.setItem("lsf."+k,v);}catch(e){return null;}return null;}
function h(tag,attrs,kids){var el=document.createElement(tag),k,i;attrs=attrs||{};
 for(k in attrs){if(attrs[k]===null||attrs[k]===undefined||attrs[k]===false){continue;}
  if(k==="class"){el.className=attrs[k];}else if(k==="text"){el.textContent=attrs[k];}else if(k.slice(0,2)==="on"){el.addEventListener(k.slice(2),attrs[k]);}else{el.setAttribute(k,attrs[k]===true?"":attrs[k]);}}
 kids=kids||[];if(!Array.isArray(kids)){kids=[kids];}
 for(i=0;i<kids.length;i++){var c=kids[i];if(c===null||c===undefined||c===false){continue;}el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);}
 return el;}
function fmtMin(m){if(m===null||m===undefined){return "not measured";}return (Math.round(m*10)/10)+" min";}
function clock(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function hhmmss(iso){return iso?String(iso).slice(11,19):"";}
function conf(){var p=(S.state&&S.state.profile)||{};return {editor:S.editor||p.editor||"vscode",root:S.wsroot||p.workspace_root||""};}
function ref(path,line,label){
 var c=conf(),url=null,txt=label||(path+(line?":"+line:"")),text=String(path)+(line?":"+line:"");
 try{url=SFEditorLinks.editorUrl(c.editor,c.root,String(path),line);}catch(e){url=null;}
 var cp=h("button",{type:"button",onclick:function(ev){var b=ev.currentTarget;try{navigator.clipboard.writeText(text);b.textContent="Copied";}catch(e){b.textContent="Copy failed";}}},"Copy path");
 if(url){return h("span",{class:"ref"},[h("a",{class:"elink mono",href:url,title:"Open in "+c.editor},txt),cp]);}
 return h("span",{class:"ref plain mono",title:"Set a valid editor and absolute workspace root in the header to get a link"},[txt,cp]);}
function tabData(name){var t=S.snap?S.snap.tabs:(S.state&&S.state.tabs);return t?t[name]:null;}
function items(t){return t&&t.available&&Array.isArray(t.items)&&t.items.length?t.items:null;}
function emptyTab(t,what){var why=t&&t.reason?t.reason:(t&&t.available?"the source holds no items":"no data was collected");
 why=String(why).replace(/^not available:\s*/,"");return h("div",{class:"empty",role:"status"},"not available: "+why);}
function chip(text,cls){return h("span",{class:"chip "+(cls||"")},text);}
function grpChip(g){return chip(g||"?","g-"+(g||"x"));}
function verdictClass(v){v=String(v||"").toLowerCase();
 if(v==="pass"){return "v-pass";}
 if(v==="fail"||v==="error"||v==="red"){return "v-fail";}
 if(/^(opened|waiting|switched|stopped|denied)$/.test(v)){return "v-wait";}return "v-mute";}
function api(path,opts){return fetch(path,opts).then(function(r){return r.text().then(function(t){var j=null;try{j=JSON.parse(t);}catch(e){}
 if(!r.ok){throw new Error((j&&j.error)||("HTTP "+r.status));}return j===null?t:j;});});}

/* ---------- header, banner, nav ---------- */
function stateOf(s){return s.state||(s.released_at?"answered":"asked");}
function asked(rt){return ((rt&&rt.stops)||[]).filter(function(x){return stateOf(x)==="asked";});}
function renderHeader(){
 var st=S.state,rt=st&&st.runtime,s=rt&&rt.status,op=s&&s.open_phase,sess=s&&s.session_elapsed_minutes,tot=s&&s.session_minutes;
 document.getElementById("clk").textContent=sess!==null&&sess!==undefined?clock(sess*60+(Date.now()-S.gotAt)/1000*(S.live?1:0)):"--:--";
 document.getElementById("clkl").textContent=(sess!==null&&sess!==undefined?"of "+clock((tot||60)*60)+" session":"session not started")+(op?" - "+op.phase:"");
 var p=(st&&st.profile)||{},c=conf(),sel=document.getElementById("ed");
 if(!sel.options.length){(SFEditorLinks.editors||[]).concat(["none"]).forEach(function(e){sel.appendChild(h("option",{value:e,text:e}));});}
 if(document.activeElement!==sel){sel.value=c.editor;}
 var ws=document.getElementById("ws");if(document.activeElement!==ws){ws.value=c.root;}
 var b=document.getElementById("banner"),stops=asked(rt),wt=document.getElementById("waiting");
 wt.textContent="";
 if(stops.length){wt.appendChild(document.createTextNode(stops.length+" decision"+(stops.length>1?"s":"")+" waiting for you"));
  if(S.tab!=="stops"){wt.appendChild(h("a",{href:"#stops"},"Review"));}}
 b.className="";
 if(rt&&rt.stop_ledger&&rt.stop_ledger!=="ok"){b.className="err";b.textContent=rt.stop_ledger;}
 else if(S.err){b.className="err";b.textContent=S.err;}
 else if(s&&s.clock_overridden){b.className="stop";b.textContent="Clock overridden by LSF_NOW: every time on this page is a rehearsal value";}
 else if(S.snap){b.className="snap";b.textContent="Viewing commit "+S.snap.sha.slice(0,8)+": the historical tabs show that commit; Now and Telemetry stay live.";}
 else{b.textContent="";}
}
function renderNav(){
 var stops=S.state?asked(S.state.runtime).length:0;
 nav.textContent="";
 TABS.forEach(function(t){var b=h("button",{type:"button",role:"tab","aria-selected":S.tab===t[0]?"true":"false","data-tab":t[0],onclick:function(){S.tab=t[0];S.sig="";try{if(location.hash!=="#"+t[0]){history.pushState(null,"","#"+t[0]);}}catch(e){}renderNav();renderTab();}},[t[1]]);
  if((t[0]==="stops"||t[0]==="now")&&stops){b.appendChild(h("span",{class:"dot","aria-label":stops+" waiting"},String(stops)));}nav.appendChild(b);});
}

/* ---------- Now ---------- */
function groupBars(budget){
 var wrap=h("div",{class:"card"},[h("h3",{},"Planned vs actual"),h("div",{class:"legend"},[h("span",{},"dashed outline: plan"),h("span",{},"solid bar: actual"),h("span",{},"time waiting on a human is counted separately")])]);
 if(!budget||budget.error){wrap.appendChild(h("p",{class:"err"},budget&&budget.error||"budget not available"));return wrap;}
 var scale=1;GROUPS.forEach(function(g){var x=budget.groups[g];scale=Math.max(scale,x.planned_minutes,x.actual_minutes||0);});
 GROUPS.forEach(function(g){var x=budget.groups[g],over=x.flag.indexOf("over")===0;

function rollbackControl(c){

  api("/api/commit?sha="+c.sha).then(function(j){box.textContent="";var msg=h("div",{class:"small err",role:"alert"});
   var yes=h("button",{type:"button",class:"primary",disabled:!!j.refusal,onclick:function(){yes.disabled=true;msg.textContent="";
    api("/api/rollback",{method:"POST",headers:{"Content-Type":"application/json","X-LSF-Token":S.token},body:JSON.stringify({sha:c.sha,confirm_sha:j.sha})})
     .then(function(){S.rb=null;S.sig="";return poll();}).catch(function(e){msg.textContent="Could not roll back: "+e.message;yes.disabled=false;});}},"Confirm rollback");
   box.appendChild(h("div",{class:"card dec"},[h("b",{},j.subject),h("div",{class:"small mute"},j.files.length+" file"+(j.files.length===1?"":"s")+" changed: "+j.files.slice(0,12).join(", ")+(j.files.length>12?" ...":"")),
    h("p",{class:"small"},"This adds a new commit that undoes it; history is kept."),j.refusal?h("p",{class:"small err",role:"alert"},"Cannot roll back now: "+j.refusal):null,
    h("div",{class:"row2"},[yes,h("button",{type:"button",onclick:close},"Cancel")]),msg]));
  }).catch(function(e){box.textContent="";box.appendChild(h("div",{class:"small err",role:"alert"},"Could not load the commit: "+e.message));box.appendChild(h("button",{type:"button",onclick:close},"Close"));});}
 if(!S.token){return h("span",{class:"small"},["No token in this URL, so run in a terminal: ",h("code",{},"lsf rollback "+c.sha.slice(0,8)+" --yes")]);}

  var first=!S.state,tabsChanged=first||strip(S.state.tabs)!==strip(st.tabs),rtChanged=first||strip(S.state.runtime)!==strip(st.runtime);
