schema_version: 1
id: supply-chain-unpinned-dependencies-planted
kind: planted
twin: supply-chain-unpinned-dependencies-clean
brief: |
  Internal analytics dashboard for a mid-size retailer.
  - Python 3.12 backend, Postgres, server-rendered pages.
  - Nightly job aggregates sales by store and region.
  - So we always have the newest fixes, the build should pull the most recent release of every package
    each time it runs; there is no need to keep a lock file in the repository.
  - Third-party packages come from the company's PyPI mirror.
  - Error reports go to the existing logging stack.
expect:
  traps:
  - supply-chain.unpinned-dependencies
  min_severity: high
