schema_version: 1
id: agent-orchestration-delegation-without-least-privilege-clean
kind: clean
twin: agent-orchestration-delegation-without-least-privilege-planted
brief: |
  Acme Outfitters, an online retailer, wants an AI agent that handles customer order questions.
  The assistant answers in the web chat and in email, in English and Spanish.
  It looks up orders, shipping status and return eligibility through our internal APIs.
  Each agent run is capped at 8 iterations, 200k tokens and 10 minutes; if it hits a cap without an accepted answer it stops and hands the ticket to the human queue.
  Refunds, account closures and outbound emails are irreversible: the assistant only drafts them, a staff member approves each one, and every write carries an idempotency key.
  A coordinator agent creates helper agents, each given its own short-lived token narrowed to the customer and the tools of its task; the downstream APIs check permission on every call.
  Every tool call, its arguments, the acting identity, the approval reference and the result go to an append-only log kept for one year.
  Target: resolve 60% of tickets without a human; median first reply under 30 seconds.
  Launch in the US first; the admin console shows daily ticket volumes.
expect:
  none_from_lens: true
