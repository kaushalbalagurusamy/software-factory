schema_version: 1
id: numeric-representation-naive-local-timestamps-planted
kind: planted
twin: numeric-representation-naive-local-timestamps-clean
brief: |
  Product brief: appointment booking for a chain of physiotherapy clinics in three countries.
  Clinics are in different time zones; patients book online.
  Prices are stored as integer cents with the currency code; no division is performed.
  Ids and counters are 64-bit integers; arithmetic on them fails loudly on overflow.
  Requirement 1: patients pick a clinic, a therapist and a free slot.
  Requirement 2: appointment times are saved as the date and time shown on the clinic's wall clock, in a timestamp column without time zone, and compared directly when ordering head-office lists.
  Requirement 3: reminders are sent 24 hours before each appointment.
  Requirement 4: head office sees all bookings across clinics in one list ordered by time.
  Success: no-shows fall by a quarter.
expect:
  traps:
  - numeric-representation.naive-local-timestamps
  min_severity: high
