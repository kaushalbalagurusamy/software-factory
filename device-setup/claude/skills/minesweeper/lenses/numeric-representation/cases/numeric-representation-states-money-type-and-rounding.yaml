schema_version: 1
id: numeric-representation-states-money-type-and-rounding
kind: clean
twin: numeric-representation-omits-money-type-and-rounding
brief: |
  Product brief: expense splitting for shared households.
  Housemates record shared bills and the app shows who owes whom.
  All timestamps are stored in UTC.
  Ids are 64-bit integers.
  Requirement 1: record a bill with an amount, stored as integer minor units with its currency code, and the people sharing it.
  Requirement 2: split each bill equally or by custom shares, rounding each share down to the minor unit and assigning the leftover units to the payer, so shares always sum exactly to the bill.
  Requirement 3: show each person's net balance and a settle-up suggestion.
  Success: households settle up monthly without arguments.
expect:
  none_from_lens: true
