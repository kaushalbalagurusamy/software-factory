schema_version: 1
id: numeric-representation-order-dependent-float-aggregation-planted
kind: planted
twin: numeric-representation-order-dependent-float-aggregation-clean
brief: |
  Product brief: energy usage analytics for a building operator.
  Meters report kilowatt-hour readings every 15 minutes as floating-point values.
  All timestamps are stored in UTC; each customer's IANA time zone is stored for display.
  Ids and counters are 64-bit integers; arithmetic on them fails loudly on overflow.
  Requirement 1: a streaming job keeps a running monthly total per building.
  Requirement 2: a batch job recomputes the monthly totals overnight from raw readings.
  Requirement 3: the batch job sums readings in parallel across shards in whatever order they finish, and the batch and streaming totals must match to the last digit or the report is blocked.
  Requirement 4: building managers see a monthly usage chart.
  Success: monthly reports go out on the first working day.
expect:
  traps:
  - numeric-representation.order-dependent-float-aggregation
  min_severity: medium
