schema_version: 1
id: media-pipelines-hdr-quantized-to-8bit-clean
kind: clean
twin: media-pipelines-hdr-quantized-to-8bit-planted
brief: |
  A real-estate photography service - HDR merge

  - Photographers upload bracketed exposures of each room and receive one merged image.
  - Inputs: up to 5 bracketed RAW exposures of at most 48 megapixels, 14-bit sensor data; output a 16-bit linear TIFF and an HDR AVIF (PQ, BT.2020).
  - RAW data is decoded to 32-bit float linear-light RGB; merging and tone mapping run in float, and quantization to the output bit depth happens only at final encode.
  - Each worker has a 16 GB memory limit and processes one burst at a time.
  - Merged images are delivered within 2 minutes of upload.
expect:
  none_from_lens: true
