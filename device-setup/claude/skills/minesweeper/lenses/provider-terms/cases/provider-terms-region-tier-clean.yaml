schema_version: 1
id: provider-terms-region-tier-clean
kind: clean
twin: provider-terms-region-tier-planted
brief: |
  Contoso Travel Notes: itinerary summariser

  1. Summarise booking confirmations into a one-page itinerary using a hosted model's API.
  2. Launch simultaneously in Germany, France, the UK and Switzerland.
  3. Use the provider's paid API tier, which its terms require for apps serving users in those
     countries; launch markets are checked against the provider's supported-regions list.
  4. Only itinerary text is sent; outputs are shown to the user and not used elsewhere.
  5. Mobile and web clients.
expect:
  none_from_lens: true
