schema_version: 1
id: company-context-assumed-data-rights-clean
kind: clean
twin: company-context-assumed-data-rights-planted
brief: |
  A regional clinic network's software vendor sells a scheduling platform to clinics, which pay an
  annual licence. Patients book through it.
  Build an assistant that drafts replies to patient messages:
  - Use a general model with no training on client data; only clinics whose contracts permit it
    and who opt in may supply example replies, and each clinic's data is used only for that clinic.
  - Drafts are reviewed by clinic staff before sending.
  - The vendor names its health-privacy regulator and follows its rules for hosting.
  Success: staff spend 40% less time on routine replies.
expect:
  none_from_lens: true
