schema_version: 1
id: privacy-regulated-data-edge-cache-clean
kind: clean
twin: privacy-regulated-data-edge-cache-planted
brief: |
  Acme Health Coach: symptom diary app for EU users

  1. Users log symptoms, medication and mood daily.
  2. Processing of health data is based on the user's explicit consent; our cloud host has a signed
     Article 28 processor contract.
  3. Only static assets are cached at the CDN edge; personalised API responses are marked no-store,
     and diary data is stored and processed in EU regions only.
  4. Diary data is kept until the user deletes their account.
expect:
  none_from_lens: true
