brief: |
  A finance operations team wants one assistant to handle routine vendor work.
  - It can read invoices from the shared drive and schedule payments through the payments tool server.
  - Payments above 1,000 USD need a manager's approval.
  - Third-party utilities (PDF tools, translation) run in a separate assistant with no access to the payments
    server; the payments assistant connects only to the two internal servers.
  - Activity is reported in a daily digest.
