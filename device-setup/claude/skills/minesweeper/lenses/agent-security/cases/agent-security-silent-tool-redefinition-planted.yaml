schema_version: 1
id: agent-security-silent-tool-redefinition-planted
kind: planted
twin: agent-security-silent-tool-redefinition-clean
brief: |
  An engineering team wants its coding assistant connected to a few internal and vendor tool servers.
  - Servers are reviewed by the security team before first use.
  - The assistant runs in a container with access to the repository only.
  - After that first review the servers update themselves and the assistant picks up their new tool lists
    and descriptions automatically; nobody needs to re-approve anything.
  - Each tool call is logged with its arguments.
expect:
  traps:
  - agent-security.silent-tool-redefinition
  min_severity: high
