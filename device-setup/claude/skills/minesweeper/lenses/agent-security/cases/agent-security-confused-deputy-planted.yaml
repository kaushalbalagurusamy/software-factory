schema_version: 1
id: agent-security-confused-deputy-planted
kind: planted
twin: agent-security-confused-deputy-clean
brief: |
  A property-management firm wants a chat assistant over its tenant database.
  - Tenants and staff sign in through the firm's portal.
  - The assistant uses a tool server to look up leases, payments and maintenance tickets.
  - For simplicity the tool server connects with one administrator database login and answers whatever
    the assistant asks, for any tenant.
  - All tool calls are logged with the requesting user.
  - The portal must stay usable on mobile.
expect:
  traps:
  - agent-security.confused-deputy
  min_severity: high
