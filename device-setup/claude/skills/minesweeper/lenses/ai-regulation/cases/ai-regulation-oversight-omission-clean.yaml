id: ai-regulation-oversight-omission-clean
kind: clean
twin: ai-regulation-oversight-omission
brief: |
  Fabrikam Lending: consumer loan pre-approval for EU applicants

  1. Applicants upload payslips and bank statements; a model estimates repayment capacity.
  2. The system is classified as high-risk under EU AI Act Annex III (creditworthiness).
  3. The model outputs approve, refer or decline with a reason code; every decline is reviewed by a
     credit officer who can override it, and all inputs, outputs and overrides are logged automatically.
  4. Applicants are told an automated system assessed their application.
  5. Decisions returned within one minute.
expect:
  none_from_lens: true
