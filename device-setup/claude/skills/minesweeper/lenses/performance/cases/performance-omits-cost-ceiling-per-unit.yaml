brief: |
  Acme Fitness - workout video library

  - Members stream on-demand workout videos in up to 1080p.
  - Load model: peak 20,000 concurrent streams, average 3 Mbit/s each, served from one cloud region to members worldwide.
  - Video start time must be under 2 seconds at p95, measured in the member's app.
  - Members can download videos for offline use.
  - New videos are published weekly.
