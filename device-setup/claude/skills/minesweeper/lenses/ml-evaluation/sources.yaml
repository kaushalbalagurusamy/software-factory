  - id: sklearn-calibration
    title: "scikit-learn User Guide: Probability calibration"
    url: https://scikit-learn.org/stable/modules/calibration.html
    adapter: web_page
    tier: primary
    kind: docs
    quotes:
      - text: Some models can give you poor estimates of the class probabilities and some even do not support probability prediction
        locator: 1.16 Probability calibration
        fetched: "2026-10-14"
        supports: [ml-evaluation.uncalibrated-scores-as-probabilities]
      - text: a well calibrated (binary) classifier should classify the samples such that among the samples to which it gave a predict_proba value close to, say, 0.8, approximately 80% actually belong to the positive class.
        locator: 1.16 Probability calibration
        fetched: "2026-10-14"
        supports: [ml-evaluation.uncalibrated-scores-as-probabilities]
  - id: sklearn-metrics
