schema_version: 1
sources:
  - id: sklearn-pitfalls
    title: "scikit-learn User Guide: Common pitfalls and recommended practices (data leakage)"
    url: https://scikit-learn.org/stable/common_pitfalls.html
    adapter: web_page
    tier: primary
    kind: docs
    quotes:
      - text: Data leakage occurs when information that would not be available at prediction time is used when building the model. This results in overly optimistic performance estimates, for example from cross-validation, and thus poorer performance when the model is used on actually novel data, for example during production.
        locator: 12.2 Data leakage
        fetched: "2026-10-14"
        supports: [ml-evaluation.preprocessing-leakage]
      - text: The general rule is to never call fit on the test data. While this may sound obvious, this is easy to miss in some cases, for example when applying certain pre-processing steps.
        locator: 12.2 Data leakage
        fetched: "2026-10-14"
        supports: [ml-evaluation.preprocessing-leakage]
  - id: sklearn-cv
    title: "scikit-learn User Guide: Cross-validation (grouped and time-series splits)"
    url: https://scikit-learn.org/stable/modules/cross_validation.html
    adapter: web_page
    tier: primary
    kind: docs
    quotes:
      - text: If one knows that the samples have been generated using a time-dependent process, it is safer to use a time-series aware cross-validation scheme. Similarly, if we know that the generative process has a group structure (samples collected from different subjects, experiments, measurement devices), it is safer to use group-wise cross-validation.
        locator: 3.1.2.1 Cross-validation iterators for i.i.d. data, Note
        fetched: "2026-10-14"
        supports: [ml-evaluation.random-split-on-dependent-data]
      - text: classical cross-validation techniques such as KFold and ShuffleSplit assume the samples are independent and identically distributed, and would result in unreasonable correlation between training and testing instances (yielding poor estimates of generalization error) on time series data.
        locator: 3.1.2.6 Cross validation of time series data
        fetched: "2026-10-14"
        supports: [ml-evaluation.random-split-on-dependent-data]
