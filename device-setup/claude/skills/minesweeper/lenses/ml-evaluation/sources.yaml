  - id: saito-2015
    title: Saito, Rehmsmeier, The Precision-Recall Plot Is More Informative than the ROC Plot When Evaluating Binary Classifiers on Imbalanced Datasets (PLOS ONE 10(3), 2015)
    url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0118432
    adapter: paper
    tier: primary
    kind: paper
    quotes:
      - text: We show here that the visual interpretability of ROC plots in the context of imbalanced datasets can be deceptive with respect to conclusions about the reliability of classification performance, owing to an intuitive but wrong interpretation of specificity.
        locator: Abstract
        fetched: "2026-10-14"
        supports: [ml-evaluation.accuracy-on-imbalanced-classes]
