# Default eight-role stage graph (TB-12, SFN-02). Data only; see docs/hooks/graph.md.
# qa supervises implement and invokes the test stage as its runner.
stages:
  - {id: orchestrate, role: orchestrator}
  - {id: research, role: research}
  - {id: design, role: design}
  - {id: audit, role: audit, gate: true}
  - {id: implement, role: implement}
  - {id: qa, role: qa}
  - {id: test, role: test}
  - {id: review, role: review, gate: true}
edges:
  - [orchestrate, research]
  - [research, design]
  - [design, audit]
  - [audit, implement]
  - [implement, qa]
  - [qa, test]
  - [test, review]
loops:
  - [qa, implement]
  - [review, implement]
subsets:
  small: [orchestrator, implement, qa, test, review]
