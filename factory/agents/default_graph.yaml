# Default seven-role stage graph (TB-12). Data only; see docs/hooks/graph.md.
stages:
  - {id: orchestrate, role: orchestrator}
  - {id: research, role: research}
  - {id: design, role: design}
  - {id: audit, role: audit, gate: true}
  - {id: implement, role: implement}
  - {id: test, role: test}
  - {id: review, role: review, gate: true}
edges:
  - [orchestrate, research]
  - [research, design]
  - [design, audit]
  - [audit, implement]
  - [implement, test]
  - [test, review]
loops:
  - [test, implement]
  - [review, implement]
subsets:
  small: [orchestrator, implement, test, review]
