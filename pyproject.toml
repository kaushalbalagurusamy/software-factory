[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
description = "Autonomous Software Factory with Intrinsic Semantic Parity and Epistemic Zero-Trust Verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kaushal Balagurusamy & Project Unity Working Group" }
]
dependencies = [
    "pyyaml>=6.0",
    "z3-solver>=5.1.0",
    "networkx>=3.4",
    "hypothesis>=6.100",
    "pytest>=8.0",
    "deal>=4.24.0",
    "crosshair-tool>=0.0.110",
]

# Deliberately no `unity` extra: the semantic verifier (Unity-IR) is installed only from a trusted local
# checkout, `pip install -e "$UNITY_REPO"` (scripts/dev-env.sh does this). A bare package name here could
# resolve to an unrelated public package of the same name (dependency confusion).

[project.scripts]
sf = "factory.cli:main"
factory = "factory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["factory*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "requires_unity: needs the Unity compiler and its examples (UNITY_REPO); fails, never skips, when absent",
]

